# Injected into the Twig section of an October `.htm` file. Named "October
# Twig" rather than "Twig" so it cannot collide with a standalone Twig
# extension - Zed resolves injection languages by name, and two languages
# sharing one name resolve in extension load order.
name = "October Twig"
grammar = "october_twig"
path_suffixes = []
hidden = true
block_comment = ["{# ", " #}"]
autoclose_before = "<}])>"
brackets = [
    # The space is part of `start`. Zed matches a pair when the character you
    # just typed is the last character of `start` and the buffer already holds
    # the rest, so typing `{%` then space gives `{% | %}` - Twig's own spacing.
    # A pair without the trailing space cannot coexist with these: it would
    # match on `%` first, and the space would then fire this one too.
    { start = "{{ ", end = " }}", close = true, newline = false },
    { start = "{% ", end = " %}", close = true, newline = false },
    { start = "{# ", end = " #}", close = true, newline = false },
    # No single `{` pair: it would close on the first brace of `{{`.
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
]
word_characters = ["-"]

# Inside `{% %}` and `{{ }}` only Twig completions make sense. Markup between
# the tags is the injected HTML layer, where Emmet and the HTML server stay
# available because this config no longer applies.
scope_opt_in_language_servers = [
    "intelephense",
    "vscode-html-language-server",
    "emmet-language-server",
]
