# Injected into the PHP section of an October `.htm` file. Uses the tag-less
# `php_only` grammar, which parses the section with or without `<?php ... ?>`.
# Named "October PHP" so it cannot collide with the `php_only` language the
# Blade extension registers under the same grammar.
name = "October PHP"
grammar = "php_only"
path_suffixes = []
hidden = true
line_comments = ["// ", "# "]
block_comment = { start = "/*", end = "*/", prefix = "* ", tab_size = 1 }
documentation_comment = { start = "/**", end = "*/", prefix = "* ", tab_size = 1 }
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "/*", end = " */", close = true, newline = false, not_in = ["string", "comment"] },
]
collapsed_placeholder = "/* ... */"

# Only intelephense belongs inside `<?php ?>`. The rest are blocked here.
scope_opt_in_language_servers = [
    "vscode-html-language-server",
    "emmet-language-server",
]
