# Injected into the configuration section of an October `.htm` file. Named
# "October INI" so it cannot collide with a standalone INI extension.
name = "October INI"
grammar = "ini"
path_suffixes = []
hidden = true
line_comments = ["; ", "# "]

# The INI header is not PHP or HTML. Listing a server here without any
# override opting back into it stops Zed querying it in this section.
scope_opt_in_language_servers = [
    "intelephense",
    "vscode-html-language-server",
    "emmet-language-server",
]
autoclose_before = ":.,=}])>"
brackets = [
    { start = "[", end = "]", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
