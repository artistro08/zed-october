name = "October CMS"
grammar = "october"
path_suffixes = ["htm"]
autoclose_before = "}])>"
brackets = [
    { start = "{{", end = "}}", close = true, newline = false },
    { start = "{%", end = "%}", close = true, newline = false },
    { start = "{#", end = "#}", close = true, newline = false },
    # No single `{` pair: it would fire first and turn a typed `{{` into `{{}}}`.
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
]
word_characters = ["-"]

# HTML/CSS/JS/PHP indentation comes from the injected layers' own indents.scm.
# Twig block tags cannot: gbprod/tree-sitter-twig parses `{% if %}` and
# `{% endif %}` as unrelated siblings, so there is no node spanning the block
# for an indents.scm query to match. These patterns cover that gap. Zed reads
# them from the buffer's root language, which is why they live here and not in
# languages/twig/config.toml.
increase_indent_pattern = "^\\s*\\{%-?~?\\s*(if|elseif|else|for|block|macro|embed|filter|apply|autoescape|spaceless|sandbox|cache|ifchanged|put|with|verbatim)\\b"
decrease_indent_pattern = "^\\s*\\{%-?~?\\s*(end(if|for|block|macro|embed|filter|apply|autoescape|spaceless|sandbox|cache|ifchanged|put|with|verbatim)|else|elseif)\\b"
