id = "october"
name = "October CMS"
version = "0.3.0"
schema_version = 1
authors = ["Devin Green <design@devingreen.me>"]
description = "Syntax highlighting for October CMS templates in Zed"
repository = "https://github.com/artistro08/zed-october"

[grammars.october]
repository = "https://github.com/artistro08/tree-sitter-october"
rev = "6085e31b3a904eb4f08b67fdd03f8436ee731825"

[grammars.ini]
repository = "https://github.com/justinmk/tree-sitter-ini"
rev = "e4018b5176132b4f3c5d6e61cea383f42288d0f5"

# gbprod/tree-sitter-twig, vendored and renamed away from the global name
# `twig` so a standalone Twig extension cannot win the registration, and
# taught October's named tag parameters (`{% partial 'x' year=2026 %}`).
[grammars.october_twig]
repository = "https://github.com/artistro08/tree-sitter-october"
rev = "daa1eca032e40fed2651c70f08ca0847251fcd3f"
path = "twig"

# Tag-less PHP dialect. October's PHP section may be written with or without
# `<?php ... ?>`; this grammar handles both, while the plain `php` grammar
# treats everything outside the tags as inert text.
[grammars.php_only]
repository = "https://github.com/tree-sitter/tree-sitter-php"
rev = "3f2465c217d0a966d41e584b42d75522f2a3149e"
path = "php_only"
